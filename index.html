<script>    
    // 🔴 你的專屬 Apps Script 網址
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-iWf06xY8M_cqj4bjpxZQJaC4EOHlT-PB04wjcXXFwoFfxOMIpDCNJ22jv2fsvhgJ/exec";

    const STORAGE_KEY = 'site_active_tasks';        
    const TRADES_KEY = 'site_active_trades';

    const defaultTrades = [            
      "給排水", "消防", "弱電", "雨水", "空調排氣", "發電機簽證", "筏基人孔",            
      "防火門", "格柵", "玻璃", "鐵件", "鋁窗", "樓梯扶手",            
      "泥作", "木作", "粗工", "油漆", "瓦斯", "衛浴", "廚具", "車梯", "電梯"        
    ];

    let customTrades = JSON.parse(localStorage.getItem(TRADES_KEY)) || defaultTrades;        
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    let currentFloorFilter = 'all';        
    let currentTradeFilter = 'all';

    // 📥 雲端下載功能（智慧容錯版：自動對應任何標題名稱）
    async function pullFromCloud() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("AKfycby...")) {
        alert("⚠️ 尚未設定 Apps Script 網址！");
        return;
      }
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          tasks = data.map(row => {
            const keys = Object.keys(row);
            const findVal = (keywords) => {
              for (let k of keys) {
                if (keywords.some(kw => k.includes(kw))) return row[k];
              }
              return '';
            };

            return {
              id: findVal(['工項編號', 'id']) || `T-${Math.random().toString().slice(-4)}`,
              floor: findVal(['樓層', '區域', 'floor']) || '7F',
              name: findVal(['施工項目', '內容', 'name']) || '未命名工項',
              trade: findVal(['責任工種', '工種', 'trade']) || '給排水',
              dep: findVal(['前置', '依賴', 'dep']) || '無',
              check: findVal(['關鍵查驗', '查驗', 'check']) || '確認施工品質合格',
              status: findVal(['狀態', 'status']) || '未開始',
              reason: findVal(['卡關', '原因', '備註', 'reason']) || ''
            };
          });

          saveData();
          alert(`✅ 成功下載雲端最新進度！共 ${tasks.length} 筆`);
        } else {
          alert("⚠️ 雲端試算表目前沒有資料！");
        }
      } catch (err) {
        alert("❌ 下載失敗，請檢查網路連線。");
        console.error(err);
      }
    }

    // 📤 雲端上傳功能
    async function pushToCloud() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("AKfycby...")) {
        alert("⚠️ 尚未設定 Apps Script 網址！");
        return;
      }
      if (tasks.length === 0) {
        alert("目前沒有資料可上傳！");
        return;
      }
      if (!confirm(`確定要將目前手機上的 ${tasks.length} 筆最新進度覆蓋回雲端試算表嗎？`)) return;

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(tasks)
        });
        alert("✅ 已成功送出上傳指令至雲端試算表！");
      } catch (err) {
        alert("❌ 上傳失敗，請稍後再試。");
        console.error(err);
      }
    }

    function saveData() {            
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));            
      renderFloorFilterBar();            
      renderApp();        
    }

    function saveTrades() {            
      localStorage.setItem(TRADES_KEY, JSON.stringify(customTrades));            
      renderTradeFilterBar();            
      renderApp();        
    }

    function updateStatus(id, newStatus) {            
      const t = tasks.find(item => item.id === id);            
      if (t) {                
        t.status = newStatus;                
        saveData();            
      }    
    }

    function updateReason(id, text) {            
      const t = tasks.find(item => item.id === id);            
      if (t) {                
        t.reason = text;                
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));            
      }    
    }

    function setFloorFilter(floor, el) {            
      currentFloorFilter = floor;            
      document.querySelectorAll('.floor-pill').forEach(btn => btn.classList.remove('active'));            
      el.classList.add('active');            
      renderApp();    
    }

    function setTradeFilter(trade, el) {            
      currentTradeFilter = trade;            
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));            
      el.classList.add('active');            
      renderApp();    
    }

    function openCreateModal(defaultFloor) {            
      document.getElementById('modalTitle').innerText = '新增施工工項';            
      document.getElementById('editTaskId').value = '';            
      document.getElementById('inputId').disabled = false;            
      const targetFloor = defaultFloor || (currentFloorFilter !== 'all' ? currentFloorFilter : '7F');            
      document.getElementById('inputFloor').value = targetFloor;            
      document.getElementById('inputId').value = `${targetFloor}-${Date.now().toString().slice(-4)}`;            
      document.getElementById('inputName').value = '';            
      populateTradeSelect('給排水');            
      document.getElementById('inputDep').value = '無';            
      document.getElementById('inputCheck').value = '確認施工品質合格';            
      document.getElementById('inputStatus').value = '未開始';            
      document.getElementById('inputReason').value = '';            
      document.getElementById('btnDeleteTask').style.display = 'none';            
      document.getElementById('taskModal').classList.add('open');    
    }

    function openEditModal(id) {            
      const t = tasks.find(item => item.id === id);            
      if (!t) return;            
      document.getElementById('modalTitle').innerText = `編輯工項 [${t.id}]`;            
      document.getElementById('editTaskId').value = t.id;            
      document.getElementById('inputId').value = t.id;            
      document.getElementById('inputId').disabled = true;            
      document.getElementById('inputFloor').value = t.floor;            
      document.getElementById('inputName').value = t.name;            
      populateTradeSelect(t.trade);            
      document.getElementById('inputDep').value = t.dep;            
      document.getElementById('inputCheck').value = t.check;            
      document.getElementById('inputStatus').value = t.status;            
      document.getElementById('inputReason').value = t.reason || '';            
      document.getElementById('btnDeleteTask').style.display = 'block';            
      document.getElementById('taskModal').classList.add('open');    
    }

    function closeModal() {            
      document.getElementById('taskModal').classList.remove('open');    
    }

    function populateTradeSelect(selected) {            
      const sel = document.getElementById('inputTrade');            
      sel.innerHTML = '';            
      customTrades.forEach(tr => {                
        const opt = document.createElement('option');                
        opt.value = tr;                
        opt.innerText = tr;                
        if (tr === selected) opt.selected = true;                
        sel.appendChild(opt);      
      });            
      if (selected && !customTrades.includes(selected)) {                
        const opt = document.createElement('option');                
        opt.value = selected;                
        opt.innerText = selected;                
        opt.selected = true;                
        sel.appendChild(opt);      
      }    
    }

    function saveTaskModal() {            
      const editId = document.getElementById('editTaskId').value;            
      const idVal = document.getElementById('inputId').value.trim();            
      const nameVal = document.getElementById('inputName').value.trim();            
      const floorVal = document.getElementById('inputFloor').value.trim();            
      if (!idVal || !nameVal || !floorVal) {                
        alert('請填寫樓層、工項編號與施工項目！');                
        return;      
      }

      if (editId) {                
        const t = tasks.find(item => item.id === editId);                
        if (t) {                    
          t.floor = floorVal;                    
          t.name = nameVal;                    
          t.trade = document.getElementById('inputTrade').value;                    
          t.dep = document.getElementById('inputDep').value;                    
          t.check = document.getElementById('inputCheck').value;                    
          t.status = document.getElementById('inputStatus').value;                    
          t.reason = document.getElementById('inputReason').value;                
        }      
      } else {                
        if (tasks.some(item => item.id === idVal)) {                    
          alert('工項編號已存在！');                    
          return;        
        }                
        tasks.push({                    
          id: idVal,                    
          floor: floorVal,                    
          name: nameVal,                    
          trade: document.getElementById('inputTrade').value,                    
          dep: document.getElementById('inputDep').value,                    
          check: document.getElementById('inputCheck').value,                    
          status: document.getElementById('inputStatus').value,                    
          reason: document.getElementById('inputReason').value        
        });      
      }            
      closeModal();            
      saveData();    
    }

    function deleteTask() {            
      const editId = document.getElementById('editTaskId').value;            
      if (!editId) return;            
      if (confirm(`確定要刪除 [${editId}] 嗎？`)) {                
        tasks = tasks.filter(item => item.id !== editId);                
        closeModal();                
        saveData();      
      }    
    }

    // 工種管理        
    function openTradeMgrModal() {            
      renderTradeMgrList();            
      document.getElementById('tradeMgrModal').classList.add('open');    
    }

    function closeTradeMgrModal() {            
      document.getElementById('tradeMgrModal').classList.remove('open');    
    }

    function renderTradeMgrList() {            
      const el = document.getElementById('tradeMgrList');            
      el.innerHTML = '';            
      customTrades.forEach(tr => {                
        const row = document.createElement('div');                
        row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:6px 10px; border-radius:6px; border:1px solid #e2e8f0; font-size:0.85rem;';                
        row.innerHTML = `                    
          <span>${tr}</span>                    
          <button class="btn btn-modal-del" style="margin:0; padding:2px 8px; font-size:0.7rem;" onclick="deleteTrade('${tr}')">刪除</button>                
        `;                
        el.appendChild(row);      
      });    
    }

    function addNewTrade() {            
      const val = document.getElementById('newTradeInput').value.trim();            
      if (!val || customTrades.includes(val)) return;            
      customTrades.push(val);            
      document.getElementById('newTradeInput').value = '';            
      saveTrades();            
      renderTradeMgrList();    
    }

    function deleteTrade(tr) {            
      if (confirm(`刪除工種「${tr}」？`)) {                
        customTrades = customTrades.filter(t => t !== tr);                
        saveTrades();                
        renderTradeMgrList();      
      }    
    }

    function renderFloorFilterBar() {            
      const bar = document.getElementById('floorFilterContainer');            
      const uniqueFloors = Array.from(new Set(tasks.map(t => t.floor)));      
      const preferred = ['屋突3', '屋突2', '屋突1', '7F', '6F', '5F', '4F', '3F', '2F', '1F', 'B1', 'B2'];            
      const sortedFloors = preferred.filter(f => uniqueFloors.includes(f)).concat(uniqueFloors.filter(f => !preferred.includes(f)));

      bar.innerHTML = `<button class="floor-pill ${currentFloorFilter === 'all' ? 'active' : ''}" onclick="setFloorFilter('all', this)">全部樓層</button>`;            
      sortedFloors.forEach(f => {                
        const btn = document.createElement('button');                
        btn.className = `floor-pill ${currentFloorFilter === f ? 'active' : ''}`;                
        btn.innerText = f;                
        btn.onclick = function() { setFloorFilter(f, this); };                
        bar.appendChild(btn);      
      });    
    }

    function renderTradeFilterBar() {            
      const bar = document.getElementById('tradeFilterContainer');            
      bar.innerHTML = `                
        <button class="filter-btn ${currentTradeFilter === 'all' ? 'active' : ''}" onclick="setTradeFilter('all', this)">全部</button>                
        <button class="filter-btn danger-filter ${currentTradeFilter === 'blocked' ? 'active' : ''}" onclick="setTradeFilter('blocked', this)">🚨 僅看卡關</button>            
      `;            
      customTrades.forEach(tr => {                
        const btn = document.createElement('button');                
        btn.className = `filter-btn ${currentTradeFilter === tr ? 'active' : ''}`;                
        btn.innerText = tr;                
        btn.onclick = function() { setTradeFilter(tr, this); };                
        bar.appendChild(btn);      
      });    
    }

    function renderApp() {            
      const container = document.getElementById('app');            
      container.innerHTML = '';

      const completedCount = tasks.filter(t => t.status === '已完成').length;            
      const ongoingCount = tasks.filter(t => t.status === '進行中').length;            
      const blockedCount = tasks.filter(t => t.status === '卡關').length;            
      const totalCount = tasks.length;            
      const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      document.getElementById('total-percent').innerText = `${percent}% (${completedCount}/${totalCount})`;            
      document.getElementById('total-bar').style.width = `${percent}%`;            
      document.getElementById('stat-completed').innerText = `✅ 完成: ${completedCount}`;            
      document.getElementById('stat-ongoing').innerText = `🔄 進行: ${ongoingCount}`;            
      document.getElementById('stat-blocked').innerText = `🚨 卡關: ${blockedCount}`;

      const uniqueFloors = Array.from(new Set(tasks.map(t => t.floor)));            
      const preferred = ['屋突3', '屋突2', '屋突1', '7F', '6F', '5F', '4F', '3F', '2F', '1F', 'B1', 'B2'];            
      const floorsToRender = preferred.filter(f => uniqueFloors.includes(f)).concat(uniqueFloors.filter(f => !preferred.includes(f)));

      floorsToRender.forEach(floor => {                
        if (currentFloorFilter !== 'all' && currentFloorFilter !== floor) return;

        let floorTasks = tasks.filter(t => t.floor === floor);                
        let visibleTasks = floorTasks.filter(t => {                    
          if (currentTradeFilter === 'all') return true;                    
          if (currentTradeFilter === 'blocked') return t.status === '卡關';                    
          return t.trade === currentTradeFilter;        
        });

        if (visibleTasks.length === 0 && currentFloorFilter === 'all') return;                
        const floorCompleted = floorTasks.filter(t => t.status === '已完成').length;                
        const floorPercent = floorTasks.length > 0 ? Math.round((floorCompleted / floorTasks.length) * 100) : 0;

        const floorEl = document.createElement('div');                
        floorEl.className = 'floor-section';                
        floorEl.innerHTML = `                    
          <div class="floor-header">                        
            <div class="floor-left">                            
              <span class="floor-name">${floor}</span>                            
              <button class="btn-floor-add" onclick="openCreateModal('${floor}')">＋此層加項</button>                        
            </div>                        
            <div class="floor-bar-container">                            
              <div class="floor-bar-meta">                                
                <span>樓層進度</span>                                
                <span>${floorPercent}% (${floorCompleted}/${floorTasks.length})</span>                            
              </div>                            
              <div class="floor-bar-bg">                                
                <div class="floor-bar-fill" style="width: ${floorPercent}%"></div>                            
              </div>                        
            </div>                    
          </div>                    
          <div class="task-list"></div>                
        `;

        const listEl = floorEl.querySelector('.task-list');        
        visibleTasks.forEach(t => {                    
          const item = document.createElement('div');                    
          item.className = `task-item status-${t.status}`;                    
          item.innerHTML = `                        
            <div class="task-top">                            
              <div class="task-title">                                
                <span class="task-id">${t.id}</span>${t.name}                            
              </div>                            
              <div class="task-actions">                                
                <span class="badge-contractor">${t.trade}</span>                                
                <button class="btn-icon" onclick="openEditModal('${t.id}')">✏️</button>                            
              </div>                        
            </div>                        
            <div class="task-meta">                            
              <div class="task-check-node">⚠️ 查驗：${t.check}</div>                            
              <div class="task-dep">依賴：${t.dep}</div>            
            </div>                        
            <div class="task-controls">                            
              <select class="status-select ${t.status}" onchange="updateStatus('${t.id}', this.value)">                                
                <option value="未開始" ${t.status === '未開始' ? 'selected' : ''}>⏳ 未開始</option>                                
                <option value="進行中" ${t.status === '進行中' ? 'selected' : ''}>🔄 進行中</option>                                
                <option value="卡關" ${t.status === '卡關' ? 'selected' : ''}>🚨 卡關</option>                                
                <option value="已完成" ${t.status === '已完成' ? 'selected' : ''}>✅ 已完成</option>                            
              </select>                            
              ${t.status === '卡關' ? `                                
                <input type="text" class="block-reason-input" placeholder="填寫卡關原因"                                               
                       value="${t.reason \vert{}\vert{} ''}" onchange="updateReason('${t.id}', this.value)">                            
              ` : ''}                        
            </div>                    
          `;                    
          listEl.appendChild(item);        
        });

        container.appendChild(floorEl);      
      });    
    }

    function exportCSV() {            
      let csv = "\uFEFF工項編號,樓層/區域,施工項目詳細內容,責任工種,前置依賴項,關鍵查驗/要徑節點,狀態,卡關原因/備註\n";            
      tasks.forEach(t => {                
        csv += `"${t.id}","${t.floor}","${t.name}","${t.trade}","${t.dep}","${t.check}","${t.status}","${t.reason || ''}"\n`;      
      });            
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });            
      const a = document.createElement("a");            
      a.href = URL.createObjectURL(blob);            
      a.download = `工進表_${new Date().toISOString().slice(0,10)}.csv`;            
      a.click();    
    }

    function handleFileImport(inputEl) {            
      const file = inputEl.files[0];            
      if (!file) return;

      const reader = new FileReader();            
      reader.onload = function(e) {                
        try {                    
          const content = e.target.result;                    
          if (file.name.endsWith('.json')) {                        
            const parsed = JSON.parse(content);                        
            if (Array.isArray(parsed)) {                            
              tasks = parsed;                            
              saveData();                            
              alert(`成功匯入 ${tasks.length} 筆工項資料！`);                        
            }          
          } else if (file.name.endsWith('.csv')) {                          
            const lines = content.split('\n').filter(line => line.trim().length > 0);                          
            const imported = [];                          
            for (let i = 1; i < lines.length; i++) {                              
              const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());                              
              if (cols.length >= 7) {                                  
                imported.push({                                      
                  id: cols[0],                                      
                  floor: cols[1],                                      
                  name: cols[2],                                      
                  trade: cols[3],                                      
                  dep: cols[4],                                      
                  check: cols[5],                                      
                  status: cols[6],                                      
                  reason: cols[7] || ''                                  
                });                              
              }                          
            }                          
            if (imported.length > 0) {                              
              tasks = imported;                              
              saveData();                              
              alert(`成功從 CSV 匯入 ${imported.length} 筆工項資料！`);                          
            }          
          }                
        } catch(err) {                    
          alert('檔案讀取失敗，請確認檔案格式是否正確！');                
        }      };            
      reader.readAsText(file);            
      inputEl.value = '';    
    }

    renderFloorFilterBar();        
    renderTradeFilterBar();    
    // 自動嘗試從雲端抓取一次資料    pullFromCloud();  
  </script>
